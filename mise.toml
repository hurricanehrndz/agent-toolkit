[settings]
locked = true

[tools]
node = "24.14.1"
python = "3.14.7"
uv = "0.11.21"
"aqua:numtide/treefmt" = "2.5.0"
"aqua:j178/prek" = "0.4.12"

[tasks.setup]
description = "Install dependencies from the npm and uv lockfiles"
run = ["npm ci", "uv sync --python 3.14.7 --locked"]

[tasks.fmt]
description = "Format configured files with treefmt"
run = "treefmt"

[tasks."typecheck:python"]
description = "Type-check Python sources with mypy"
run = "uv run mypy"

[tasks."typecheck:typescript"]
description = "Type-check TypeScript sources with tsc"
run = "npm exec --no -- tsc"

[tasks.typecheck]
description = "Type-check everything (Python + TypeScript)"
depends = ["typecheck:python", "typecheck:typescript"]

[tasks."toolkit:validate"]
description = "Validate managed toolkit resources and optional scope overrides"
run = "node scripts/agent-toolkit.mjs validate"

[tasks."toolkit:status"]
description = "Show managed toolkit resource state"
run = "node scripts/agent-toolkit.mjs status"

[tasks."toolkit:sync"]
description = "Synchronize toolkit resources and install respec"
run = "node scripts/toolkit-sync.mjs"

[tasks."toolkit:uninstall"]
description = "Remove managed toolkit resources owned by this checkout"
run = "node scripts/agent-toolkit.mjs uninstall"

[tasks."test:python"]
description = "Run web helper Python unit tests"
run = "uv run python -m unittest discover -s skills/web/scripts -p '*_test.py'"

[tasks.test]
description = "Run the test suite"
depends = ["test:python"]
run = "node --test 'scripts/**/*.test.ts' 'extensions/**/*.test.ts'"

[tasks.check]
description = "Full check: prek all-files + TypeScript typecheck + tests"
depends = ["typecheck:typescript", "toolkit:validate", "test"]
run = "prek run --all-files"

[tasks."hooks:install"]
description = "Install pre-commit hooks (separate from setup/check)"
run = "prek install --force --prepare-hooks"
