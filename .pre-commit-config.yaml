repos:
  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: mise exec -- treefmt
        language: system
        files: \.md$
        require_serial: true
      - id: markdownlint
        name: markdownlint
        entry: mise exec -- npm exec --no -- markdownlint --config .markdownlint.jsonc
        language: system
        files: \.md$
        exclude: ^skills/[^/]+/SKILL\.md$
        require_serial: true
      # Skill entry points may begin directly with executable instructions.
      - id: markdownlint-skills
        name: markdownlint skills
        entry: mise exec -- npm exec --no -- markdownlint --config .markdownlint.jsonc --disable MD041 --
        language: system
        files: ^skills/[^/]+/SKILL\.md$
        require_serial: true
      - id: mypy-skill-scripts
        name: mypy skill Python scripts
        entry: mise run typecheck:python
        language: system
        pass_filenames: false
        files: ^(skills/web/scripts/web|pyproject\.toml|uv\.lock|mise\.toml|treefmt\.toml|\.pre-commit-config\.yaml)$
